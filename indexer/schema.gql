# -------------------------------------------------------
# Deposit entity
# Created when Alice locks wBTC into the anonymous pool.
# -------------------------------------------------------
type Deposit {
  id: String!           # commitment (u256 as hex string)
  commitment: String!
  leaf_index: Int!
  timestamp: BigInt!
  block_number: Int!
  tx_hash: String!
}

# -------------------------------------------------------
# Withdrawal entity
# Created when Alice does a ZK withdrawal of wBTC directly.
# -------------------------------------------------------
type Withdrawal {
  id: String!           # nullifier_hash
  recipient: String!
  nullifier_hash: String!
  block_number: Int!
  tx_hash: String!
}

# -------------------------------------------------------
# WbtcOrder entity
# Alice's open order: "I have wBTC, I want STRK."
# Updated as the order progresses through its lifecycle.
# -------------------------------------------------------
type WbtcOrder {
  id: String!                   # order_id (nullifier hash)
  wbtc_seller: String!          # Alice's address
  alice_strk_destination: String!
  wbtc_amount: String!          # u256 as string
  quoted_strk_amount: String!   # u256 as string
  hashlock: String!
  expiry: BigInt!
  rate_expiry: BigInt!

  # Set when Bob fills the order
  wbtc_buyer: String            # Bob's address (null until filled)
  strk_order_id: String         # paired StrkOrder id (null until filled)
  strk_amount_locked: String    # u256 as string (null until filled)
  bob_expiry: BigInt            # (null until filled)

  # Status flags
  is_filled: Boolean!
  is_withdrawn: Boolean!
  is_refunded: Boolean!

  # Timestamps
  posted_at_block: Int!
  posted_tx_hash: String!
  filled_at_block: Int
  withdrawn_at_block: Int
  refunded_at_block: Int
}

# -------------------------------------------------------
# StrkOrder entity
# Bob's locked STRK side of the swap.
# Also created directly for off-chain coordinated swaps.
# -------------------------------------------------------
type StrkOrder {
  id: String!               # strk_order_id
  strk_seller: String!      # Bob's address
  strk_buyer: String!       # Alice's strk destination
  strk_amount: String!      # u256 as string
  hashlock: String!
  expiry: BigInt!
  wbtc_order_id: String     # paired WbtcOrder id (null for direct orders)

  # Status flags
  is_withdrawn: Boolean!
  is_refunded: Boolean!

  # Timestamps
  posted_at_block: Int!
  posted_tx_hash: String!
  withdrawn_at_block: Int
  refunded_at_block: Int
}

# -------------------------------------------------------
# OwnershipTransfer entity
# Tracks ownership changes on the contract.
# -------------------------------------------------------
type OwnershipTransfer {
  id: String!             # tx_hash
  previous_owner: String!
  new_owner: String!
  block_number: Int!
  tx_hash: String!
}
