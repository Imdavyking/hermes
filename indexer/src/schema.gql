scalar BigDecimalU256

type OwnershipTransfer {
  id: ID!
  previous_owner: String!
  new_owner: String!
  block_number: Int!
  tx_hash: String!
}

type DcaOrder {
  id: ID!
  owner: String!
  usdc_per_interval: BigDecimalU256!
  interval_seconds: Int!
  total_intervals: Int!
  total_usdc_deposited: BigDecimalU256!
  btc_destination: String!
  executed_intervals: Int!
  is_active: Boolean!
  last_execution: Int!
  usdc_refunded: BigDecimalU256
  created_at_block: Int!
  created_tx_hash: String!
  last_executed_at_block: Int
  cancelled_at_block: Int
}

# status lifecycle per interval:
#   pending  — DCAExecuted fired, STRK sent to Atomiq, BTC not yet confirmed
#   claimed  — DCAIntervalClaimed fired, LP delivered BTC to user's address
#   refunded — DCAIntervalRefunded fired, LP failed, interval rolled back
#
# btc_received is always "0" at creation (DCAExecuted hardcodes it).
# The frontend should treat claimed status as the confirmed success signal,
# not btc_received.
type DcaExecution {
  id: ID!
  order_id: String!
  executed_intervals: Int!
  usdc_spent: BigDecimalU256!
  btc_received: BigDecimalU256!
  keeper: String!
  status: String!
  executed_at_block: Int!
  executed_tx_hash: String!
  executed_timestamp: Int!
  claimed_at_block: Int
  refunded_at_block: Int
}
