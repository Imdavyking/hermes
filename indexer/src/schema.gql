scalar BigDecimalU256

type Deposit {
  id: ID! # commitment (u256)
  commitment: BigDecimalU256!
  leaf_index: Int! # u32
  timestamp: Int! # u64
  block_number: Int!
  tx_hash: String!
}

type Withdrawal {
  id: ID! # nullifier_hash (u256)
  recipient: String! # ContractAddress
  nullifier_hash: BigDecimalU256!
  block_number: Int!
  tx_hash: String!
}

type WbtcOrder {
  id: ID! # order_id (u256)
  wbtc_seller: String! # ContractAddress
  alice_strk_destination: String! # ContractAddress
  wbtc_amount: BigDecimalU256! # u256
  quoted_strk_amount: BigDecimalU256! # u256
  hashlock: String! # felt252
  expiry: Int! # u64
  rate_expiry: Int! # u64
  # Set when filled
  wbtc_buyer: String # ContractAddress
  strk_order_id: String # paired StrkOrder id
  strk_amount_locked: BigDecimalU256 # u256
  bob_expiry: Int # u64
  # Status
  is_filled: Boolean!
  is_withdrawn: Boolean!
  is_refunded: Boolean!
  # Metadata
  posted_at_block: Int!
  posted_tx_hash: String!
  filled_at_block: Int
  withdrawn_at_block: Int
  refunded_at_block: Int
}

type StrkOrder {
  id: ID! # strk_order_id (u256)
  strk_seller: String! # ContractAddress
  strk_buyer: String! # ContractAddress
  strk_amount: BigDecimalU256! # u256
  hashlock: String! # felt252
  expiry: Int! # u64
  wbtc_order_id: String # paired WbtcOrder id (null for direct orders)
  # Status
  is_withdrawn: Boolean!
  is_refunded: Boolean!
  # Metadata
  posted_at_block: Int!
  posted_tx_hash: String!
  withdrawn_at_block: Int
  refunded_at_block: Int
}

type OwnershipTransfer {
  id: ID! # tx_hash
  previous_owner: String! # ContractAddress
  new_owner: String! # ContractAddress
  block_number: Int!
  tx_hash: String!
}

# ── DCA ───────────────────────────────────────────────────────────────────────

type DcaOrder {
  id: ID! # order_id (u256, decimal string)
  # Identity
  order_id: BigDecimalU256! # u256 — same value as id, kept for query filters
  owner: String! # ContractAddress — ZK note owner
  usdc_recipient: String! # ContractAddress — receives purchased wBTC
  # Schedule
  usdc_per_interval: BigDecimalU256! # u256, USDC 6-dec
  interval_seconds: Int! # u64
  executions_total: Int! # u32 — snapshot at creation
  executions_left: Int! # u32 — decremented on each DCAExecuted
  next_execution: Int! # u64 unix ts — updated after each execution
  # Status
  is_cancelled: Boolean!

  # Metadata
  created_at_block: Int!
  created_tx_hash: String!
  last_executed_at_block: Int # null until first execution
  cancelled_at_block: Int # null unless cancelled
}

type DcaExecution {
  id: ID! # "{order_id}-{execution_number}"
  # Parent order
  order_id: String! # matches DcaOrder.id
  # Execution details
  execution_number: Int! # 1-based counter (executions_total - executions_left)
  usdc_spent: BigDecimalU256! # u256, USDC 6-dec
  wbtc_received: BigDecimalU256! # u256, satoshis
  btc_price_usd: BigDecimalU256! # u256, oracle price 8-dec
  # Metadata
  executed_at_block: Int!
  executed_tx_hash: String!
  executed_timestamp: Int! # u64 unix ts from block
}
